name: AI money-flow KPIs
# Daily KPI readings for the AI infrastructure desk (spending, chips, memory,
# power) plus the "Nasdaq through the AI lens" data. Model-free. Daily on
# purpose: the spot-price and GPU-rental series only exist as our own daily
# snapshots, so every missed day is lost history. Each source fails alone and
# the scripts keep the last good record.
on:
  schedule:
    - cron: '35 13 * * *'   # daily, 13:35 UTC
  workflow_dispatch:
concurrency:
  group: ai-kpis
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  kpis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: KPI readings
        run: node scripts/fetch-ai-kpis.cjs || echo "kpis failed (non-fatal)"
      - name: Tech tape and AI lens
        run: node scripts/fetch-tech-tape.cjs || echo "tech tape failed (non-fatal)"
      - name: Commit
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # Explicit add-list by file name (the odds.json lesson): a new file must be named here.
          git add public/data/ai-kpis.json public/data/tech-tape.json data-archive/ai-kpis-state.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "data: AI money-flow KPIs"; git push || { git pull --rebase --autostash -q; git push; }; }
